MyQueueScreen As screen:
    Fill: =gColorSurface

    hdr_Bg As rectangle:
        X: =0
        Y: =0
        Width: =App.Width
        Height: =gHeaderHeight
        Fill: =gColorPrimary
        BorderThickness: =0

    hdr_AppTitle As label:
        X: =16
        Y: =0
        Width: =280
        Height: =gHeaderHeight
        Text: ="VOR Requests"
        Color: =gColorWhite
        Font: =Font.OpenSansRegular
        Size: =20
        FontWeight: =FontWeight.Bold
        VerticalAlign: =VerticalAlign.Middle

    hdr_AvatarCircle As rectangle:
        X: =App.Width - 200
        Y: =16
        Width: =32
        Height: =32
        Fill: =gColorGold
        BorderThickness: =0
        RadiusTopLeft: =16
        RadiusTopRight: =16
        RadiusBottomLeft: =16
        RadiusBottomRight: =16

    hdr_AvatarInitial As label:
        X: =App.Width - 200
        Y: =16
        Width: =32
        Height: =32
        Text: =Upper(Left(User().FullName, 1))
        Color: =gColorWhite
        Font: =Font.OpenSansRegular
        Size: =14
        FontWeight: =FontWeight.Bold
        Align: =Align.Center
        VerticalAlign: =VerticalAlign.Middle

    hdr_UserName As label:
        X: =App.Width - 360
        Y: =0
        Width: =152
        Height: =gHeaderHeight
        Text: =User().FullName
        Color: =RGBA(220, 230, 245, 1)
        Font: =Font.OpenSansRegular
        Size: =13
        VerticalAlign: =VerticalAlign.Middle
        Align: =Align.Right

    nav_Bg As rectangle:
        X: =0
        Y: =gHeaderHeight
        Width: =gNavWidth
        Height: =App.Height - gHeaderHeight
        Fill: =gColorPrimaryDark
        BorderThickness: =0

    nav_MyQueueActiveBar As rectangle:
        X: =0
        Y: =gHeaderHeight + 96
        Width: =4
        Height: =48
        Fill: =gColorGold

    nav_HomeBtn As button:
        X: =0
        Y: =gHeaderHeight
        Width: =gNavWidth
        Height: =48
        Text: ="  Home"
        Color: =RGBA(200, 215, 235, 1)
        Fill: =RGBA(255, 255, 255, 0)
        HoverFill: =RGBA(255, 255, 255, 0.1)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        Align: =Align.Left
        PaddingLeft: =20
        OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)

    nav_NewRequestBtn As button:
        X: =0
        Y: =gHeaderHeight + 48
        Width: =gNavWidth
        Height: =48
        Text: ="  New Request"
        Color: =RGBA(200, 215, 235, 1)
        Fill: =RGBA(255, 255, 255, 0)
        HoverFill: =RGBA(255, 255, 255, 0.1)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        Align: =Align.Left
        PaddingLeft: =20
        OnSelect: =Navigate(NewRequestScreen, ScreenTransition.Fade)

    nav_MyQueueBtn As button:
        X: =0
        Y: =gHeaderHeight + 96
        Width: =gNavWidth
        Height: =48
        Text: ="  My Queue"
        Color: =gColorWhite
        Fill: =RGBA(255, 255, 255, 0.12)
        HoverFill: =RGBA(255, 255, 255, 0.18)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        FontWeight: =FontWeight.Semibold
        Align: =Align.Left
        PaddingLeft: =20
        OnSelect: =Navigate(MyQueueScreen, ScreenTransition.None)

    nav_AllRequestsBtn As button:
        X: =0
        Y: =gHeaderHeight + 144
        Width: =gNavWidth
        Height: =48
        Text: ="  All Requests"
        Color: =RGBA(200, 215, 235, 1)
        Fill: =RGBA(255, 255, 255, 0)
        HoverFill: =RGBA(255, 255, 255, 0.1)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        Align: =Align.Left
        PaddingLeft: =20
        OnSelect: =Navigate(AllRequestsScreen, ScreenTransition.Fade)

    nav_ClosedBtn As button:
        X: =0
        Y: =gHeaderHeight + 192
        Width: =gNavWidth
        Height: =48
        Text: ="  Closed"
        Color: =RGBA(200, 215, 235, 1)
        Fill: =RGBA(255, 255, 255, 0)
        HoverFill: =RGBA(255, 255, 255, 0.1)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        Align: =Align.Left
        PaddingLeft: =20
        OnSelect: |-
            =Set(gClosedStatusFilter, true);
            Navigate(AllRequestsScreen, ScreenTransition.Fade)

    queue_HeaderBg As rectangle:
        X: =gContentX
        Y: =gContentY
        Width: =App.Width - gContentX
        Height: =56
        Fill: =gColorWhite
        BorderThickness: =0

    queue_HeaderLine As rectangle:
        X: =gContentX
        Y: =gContentY + 55
        Width: =App.Width - gContentX
        Height: =1
        Fill: =gColorBorder
        BorderThickness: =0

    queue_PageTitle As label:
        X: =gContentX + 24
        Y: =gContentY + 14
        Width: =400
        Height: =28
        Text: ="My Queue"
        Color: =gColorTextDark
        Font: =Font.OpenSansRegular
        Size: =18
        FontWeight: =FontWeight.Bold
        VerticalAlign: =VerticalAlign.Middle

    queue_EmptyLbl As label:
        X: =gContentX + 32
        Y: =gContentY + 100
        Width: =App.Width - gContentX - 64
        Height: =40
        Text: ="Your queue is empty — no actionable requests assigned to you."
        Color: =gColorTextMid
        Font: =Font.OpenSansRegular
        Size: =14
        Visible: =CountRows(gallery_Queue.AllItems) = 0

    gallery_Queue As gallery.galleryVertical:
        X: =gContentX
        Y: =gContentY + 56
        Width: =App.Width - gContentX
        Height: =App.Height - gContentY - 56
        TemplateSize: =80
        TemplatePadding: =0
        ShowScrollbar: =true
        Items: |-
            =Filter(
              VORRequests,
              (AssignedReviewer.Email = User().Email && CurrentStatus.Value = "Validation") ||
              (AssignedOrderer.Email = User().Email && (CurrentStatus.Value = "Orderer processing" || CurrentStatus.Value = "Parts ordered" || CurrentStatus.Value = "Parts received"))
            )
        OnSelect: |-
            =Set(gSelectedRequest, ThisItem);
            Navigate(RequestDetailScreen, ScreenTransition.Fade)

        qrow_Separator As rectangle:
            X: =0
            Y: =Parent.TemplateHeight - 1
            Width: =Parent.TemplateWidth
            Height: =1
            Fill: =gColorBorder
            BorderThickness: =0

        qrow_Bg As rectangle:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =Parent.TemplateHeight - 1
            Fill: =gColorWhite
            BorderThickness: =0

        qrow_VORBadgeBg As rectangle:
            X: =12
            Y: =28
            Width: =100
            Height: =24
            Fill: =gColorGold
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            BorderThickness: =0

        qrow_VORBadgeLbl As label:
            X: =12
            Y: =28
            Width: =100
            Height: =24
            Text: =ThisItem.Title
            Color: =gColorWhite
            Font: =Font.OpenSansRegular
            Size: =12
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle

        qrow_VehicleIDLbl As label:
            X: =124
            Y: =24
            Width: =200
            Height: =22
            Text: =ThisItem.IdentifierType.Value & ": " & ThisItem.VehicleIdentifier
            Color: =gColorTextDark
            Font: =Font.OpenSansRegular
            Size: =13
            FontWeight: =FontWeight.Semibold

        qrow_PartLbl As label:
            X: =124
            Y: =46
            Width: =200
            Height: =18
            Text: =ThisItem.PartName & " x" & Text(ThisItem.Quantity)
            Color: =gColorTextMid
            Font: =Font.OpenSansRegular
            Size: =12

        qrow_UrgencyBadgeBg As rectangle:
            X: =340
            Y: =28
            Width: =110
            Height: =24
            Fill: =Switch(ThisItem.Urgency.Value, "Safety critical", gColorUrgencySafety, "Operational", gColorUrgencyOperational, "Scheduled", gColorUrgencyScheduled, gColorBorder)
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            BorderThickness: =0

        qrow_UrgencyBadgeLbl As label:
            X: =340
            Y: =28
            Width: =110
            Height: =24
            Text: =ThisItem.Urgency.Value
            Color: =gColorWhite
            Font: =Font.OpenSansRegular
            Size: =11
            FontWeight: =FontWeight.Semibold
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle

        qrow_StatusBadgeBg As rectangle:
            X: =466
            Y: =28
            Width: =148
            Height: =24
            Fill: =Switch(ThisItem.CurrentStatus.Value, "Validation", gColorStatusValidation, "Orderer processing", gColorStatusOrderer, "Parts ordered", gColorStatusOrdered, "Parts received", gColorStatusReceived, gColorBorder)
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            BorderThickness: =0

        qrow_StatusBadgeLbl As label:
            X: =466
            Y: =28
            Width: =148
            Height: =24
            Text: =ThisItem.CurrentStatus.Value
            Color: =gColorWhite
            Font: =Font.OpenSansRegular
            Size: =11
            FontWeight: =FontWeight.Semibold
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle

        qrow_RequestorLbl As label:
            X: =630
            Y: =24
            Width: =Parent.TemplateWidth - 646
            Height: =18
            Text: =ThisItem.RequestorName
            Color: =gColorTextMid
            Font: =Font.OpenSansRegular
            Size: =12

        qrow_AgeLbl As label:
            X: =630
            Y: =42
            Width: =Parent.TemplateWidth - 646
            Height: =18
            Text: =If(IsBlank(ThisItem.DateSubmitted), "--", Text(DateDiff(ThisItem.DateSubmitted, Now(), Days)) & " days old")
            Color: =gColorTextMid
            Font: =Font.OpenSansRegular
            Size: =11
