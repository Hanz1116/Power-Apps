HomeScreen As screen:
    Fill: =gColorSurface

    hdr_Bg As rectangle:
        X: =0
        Y: =0
        Width: =App.Width
        Height: =gHeaderHeight
        Fill: =gColorPrimary
        BorderThickness: =0

    hdr_AppTitle As label:
        X: =16
        Y: =0
        Width: =280
        Height: =gHeaderHeight
        Text: ="VOR Requests"
        Color: =gColorWhite
        Font: =Font.OpenSansRegular
        Size: =20
        FontWeight: =FontWeight.Bold
        VerticalAlign: =VerticalAlign.Middle

    hdr_AvatarCircle As rectangle:
        X: =App.Width - 200
        Y: =16
        Width: =32
        Height: =32
        Fill: =gColorGold
        BorderThickness: =0
        RadiusTopLeft: =16
        RadiusTopRight: =16
        RadiusBottomLeft: =16
        RadiusBottomRight: =16

    hdr_AvatarInitial As label:
        X: =App.Width - 200
        Y: =16
        Width: =32
        Height: =32
        Text: =Upper(Left(User().FullName, 1))
        Color: =gColorWhite
        Font: =Font.OpenSansRegular
        Size: =14
        FontWeight: =FontWeight.Bold
        Align: =Align.Center
        VerticalAlign: =VerticalAlign.Middle

    hdr_UserName As label:
