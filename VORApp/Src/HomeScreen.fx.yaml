    nav_Bg As rectangle:
        X: =0
        Y: =gHeaderHeight
        Width: =gNavWidth
        Height: =App.Height - gHeaderHeight
        Fill: =gColorPrimaryDark
        BorderThickness: =0

    nav_HomeActiveMark As rectangle:
        X: =0
        Y: =gHeaderHeight
        Width: =4
        Height: =48
        Fill: =gColorGold

    nav_HomeBtn As button:
        X: =0
        Y: =gHeaderHeight
        Width: =gNavWidth
        Height: =48
        Text: ="  Home"
        Color: =gColorWhite
        Fill: =RGBA(255, 255, 255, 0.12)
        HoverFill: =RGBA(255, 255, 255, 0.18)
        PressedFill: =RGBA(255, 255, 255, 0.08)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        FontWeight: =FontWeight.Semibold
        Align: =Align.Left
        PaddingLeft: =20
        OnSelect: =Navigate(HomeScreen, ScreenTransition.None)

    nav_NewRequestBtn As button:
        X: =0
        Y: =gHeaderHeight + 48
        Width: =gNavWidth
        Height: =48
        Text: ="  New Request"
        Color: =RGBA(200, 215, 235, 1)
        Fill: =RGBA(255, 255, 255, 0)
        HoverFill: =RGBA(255, 255, 255, 0.1)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        Align: =Align.Left
        PaddingLeft: =20
        OnSelect: =Navigate(NewRequestScreen, ScreenTransition.Fade)

    nav_MyQueueBtn As button:
        X: =0
        Y: =gHeaderHeight + 96
        Width: =gNavWidth
        Height: =48
        Text: ="  My Queue"
        Color: =RGBA(200, 215, 235, 1)
        Fill: =RGBA(255, 255, 255, 0)
        HoverFill: =RGBA(255, 255, 255, 0.1)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        Align: =Align.Left
        PaddingLeft: =20
        OnSelect: =Navigate(MyQueueScreen, ScreenTransition.Fade)

    nav_AllRequestsBtn As button:
        X: =0
        Y: =gHeaderHeight + 144
        Width: =gNavWidth
        Height: =48
        Text: ="  All Requests"
        Color: =RGBA(200, 215, 235, 1)
        Fill: =RGBA(255, 255, 255, 0)
        HoverFill: =RGBA(255, 255, 255, 0.1)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        Align: =Align.Left
        PaddingLeft: =20
        OnSelect: =Navigate(AllRequestsScreen, ScreenTransition.Fade)

    nav_ClosedBtn As button:
        X: =0
        Y: =gHeaderHeight + 192
        Width: =gNavWidth
        Height: =48
        Text: ="  Closed"
        Color: =RGBA(200, 215, 235, 1)
        Fill: =RGBA(255, 255, 255, 0)
        HoverFill: =RGBA(255, 255, 255, 0.1)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        Align: =Align.Left
        PaddingLeft: =20
        OnSelect: |-
            =Set(gClosedStatusFilter, true);
            Navigate(AllRequestsScreen, ScreenTransition.Fade)

    filter_Bg As rectangle:
        X: =gContentX
        Y: =gContentY
        Width: =App.Width - gContentX
        Height: =56
        Fill: =gColorWhite
        BorderThickness: =0

    filter_BottomLine As rectangle:
        X: =gContentX
        Y: =gContentY + 55
        Width: =App.Width - gContentX
        Height: =1
        Fill: =gColorBorder
        BorderThickness: =0

    filter_StatusLbl As label:
        X: =gContentX + 16
        Y: =gContentY + 8
        Width: =60
        Height: =18
        Text: ="Status"
        Color: =gColorTextMid
        Font: =Font.OpenSansRegular
        Size: =11

    filter_StatusDD As dropDown:
        X: =gContentX + 16
        Y: =gContentY + 26
        Width: =160
        Height: =28
        Items: =gStatusChoices
        Default: ="All"
        Font: =Font.OpenSansRegular
        Size: =13
        Color: =gColorTextDark
        BorderColor: =gColorBorder
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4

    filter_UrgencyLbl As label:
        X: =gContentX + 196
        Y: =gContentY + 8
        Width: =60
        Height: =18
        Text: ="Urgency"
        Color: =gColorTextMid
        Font: =Font.OpenSansRegular
        Size: =11

    filter_UrgencyDD As dropDown:
        X: =gContentX + 196
        Y: =gContentY + 26
        Width: =152
        Height: =28
        Items: =gUrgencyChoices
        Default: ="All"
        Font: =Font.OpenSansRegular
        Size: =13
        Color: =gColorTextDark
        BorderColor: =gColorBorder
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4

    filter_SearchLbl As label:
        X: =gContentX + 368
        Y: =gContentY + 8
        Width: =60
        Height: =18
        Text: ="Search"
        Color: =gColorTextMid
        Font: =Font.OpenSansRegular
        Size: =11

    filter_SearchTI As textInput:
        X: =gContentX + 368
        Y: =gContentY + 26
        Width: =App.Width - gContentX - 384
        Height: =28
        HintText: ="VOR ref, vehicle, customer or part..."
        Font: =Font.OpenSansRegular
        Size: =13
        Color: =gColorTextDark
        BorderColor: =gColorBorder
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4

    gallery_Requests As gallery.galleryVertical:
        X: =gContentX
        Y: =gContentY + 56
        Width: =App.Width - gContentX
        Height: =App.Height - gContentY - 56
        TemplateSize: =80
        TemplatePadding: =0
        ShowScrollbar: =true
        Items: |-
            =Sort(
              Sort(
                AddColumns(
                  Filter(
                    VORRequests,
                    CurrentStatus.Value <> "Closed" &&
                    CurrentStatus.Value <> "Rejected" &&
                    (filter_StatusDD.Selected.Value = "All" ||
                      CurrentStatus.Value = filter_StatusDD.Selected.Value) &&
                    (filter_UrgencyDD.Selected.Value = "All" ||
                      Urgency.Value = filter_UrgencyDD.Selected.Value) &&
                    (IsBlank(filter_SearchTI.Text) ||
                      filter_SearchTI.Text in Title ||
                      filter_SearchTI.Text in VehicleIdentifier ||
                      filter_SearchTI.Text in CustomerName ||
                      filter_SearchTI.Text in PartName)
                  ),
                  "UrgencyOrder",
                  Switch(
                    Urgency.Value,
                    "Safety critical", 1,
                    "Operational", 2,
                    "Scheduled", 3,
                    4
                  )
                ),
                DateSubmitted,
                Descending
              ),
              UrgencyOrder,
              Ascending
            )
        OnSelect: |-
            =Set(gSelectedRequest, ThisItem);
            Navigate(RequestDetailScreen, ScreenTransition.Fade)

        row_Separator As rectangle:
            X: =0
            Y: =Parent.TemplateHeight - 1
            Width: =Parent.TemplateWidth
            Height: =1
            Fill: =gColorBorder
            BorderThickness: =0

        row_Bg As rectangle:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =Parent.TemplateHeight - 1
            Fill: =gColorWhite
            BorderThickness: =0

        row_VORBadgeBg As rectangle:
            X: =12
            Y: =28
            Width: =100
            Height: =24
            Fill: =gColorGold
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            BorderThickness: =0

        row_VORBadgeLbl As label:
            X: =12
            Y: =28
            Width: =100
            Height: =24
            Text: =ThisItem.Title
            Color: =gColorWhite
            Font: =Font.OpenSansRegular
            Size: =12
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle

        row_VehicleTypeLbl As label:
            X: =124
            Y: =14
            Width: =60
            Height: =18
            Text: =ThisItem.IdentifierType.Value
            Color: =gColorTextMid
            Font: =Font.OpenSansRegular
            Size: =11

        row_VehicleIDLbl As label:
            X: =124
            Y: =32
            Width: =160
            Height: =22
            Text: =ThisItem.VehicleIdentifier
            Color: =gColorTextDark
            Font: =Font.OpenSansRegular
            Size: =14
            FontWeight: =FontWeight.Semibold

        row_UrgencyBadgeBg As rectangle:
            X: =296
            Y: =28
            Width: =110
            Height: =24
            Fill: =Switch(ThisItem.Urgency.Value, "Safety critical", gColorUrgencySafety, "Operational", gColorUrgencyOperational, "Scheduled", gColorUrgencyScheduled, gColorBorder)
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            BorderThickness: =0

        row_UrgencyBadgeLbl As label:
            X: =296
            Y: =28
            Width: =110
            Height: =24
            Text: =ThisItem.Urgency.Value
            Color: =gColorWhite
            Font: =Font.OpenSansRegular
            Size: =11
            FontWeight: =FontWeight.Semibold
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle

        row_StatusBadgeBg As rectangle:
            X: =418
            Y: =28
            Width: =130
            Height: =24
            Fill: =Switch(ThisItem.CurrentStatus.Value, "Draft", gColorStatusDraft, "Submitted", gColorStatusSubmitted, "Validation", gColorStatusValidation, "Orderer processing", gColorStatusOrderer, "Parts ordered", gColorStatusOrdered, "Parts received", gColorStatusReceived, "Dispatched", gColorStatusDispatched, "Closed", gColorStatusClosed, "Rejected", gColorStatusRejected, gColorBorder)
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            BorderThickness: =0

        row_StatusBadgeLbl As label:
            X: =418
            Y: =28
            Width: =130
            Height: =24
            Text: =ThisItem.CurrentStatus.Value
            Color: =gColorWhite
            Font: =Font.OpenSansRegular
            Size: =11
            FontWeight: =FontWeight.Semibold
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle

        row_AgeLbl As label:
            X: =560
            Y: =20
            Width: =56
            Height: =18
            Text: =If(IsBlank(ThisItem.DateSubmitted), "--", Text(DateDiff(ThisItem.DateSubmitted, Now(), Days)) & "d")
            Color: =gColorTextMid
            Font: =Font.OpenSansRegular
            Size: =12
            Align: =Align.Center

        row_AgeSubLbl As label:
            X: =560
            Y: =38
            Width: =56
            Height: =16
            Text: ="age"
            Color: =gColorTextMid
            Font: =Font.OpenSansRegular
            Size: =10
            Align: =Align.Center

        row_RequestorLbl As label:
            X: =628
            Y: =14
            Width: =Parent.TemplateWidth - 644
            Height: =18
            Text: =ThisItem.RequestorName
            Color: =gColorTextMid
            Font: =Font.OpenSansRegular
            Size: =12

        row_BehalfOfLbl As label:
            X: =628
            Y: =32
            Width: =Parent.TemplateWidth - 644
            Height: =18
            Text: =If(ThisItem.SubmittedOnBehalfOf.Value = "Customer", "on behalf of: " & ThisItem.CustomerName, "")
            Color: =gColorGold
            Font: =Font.OpenSansRegular
            Size: =12
            FontWeight: =FontWeight.Semibold
            Visible: =ThisItem.SubmittedOnBehalfOf.Value = "Customer"

    toast_Bg As rectangle:
        X: =App.Width - 340
        Y: =App.Height - 72
        Width: =324
        Height: =52
        Fill: =RGBA(16, 110, 58, 1)
        RadiusTopLeft: =6
        RadiusTopRight: =6
        RadiusBottomLeft: =6
        RadiusBottomRight: =6
        BorderThickness: =0
