NewRequestScreen As screen:
    Fill: =gColorSurface
    OnVisible: |-
        =Set(gSubmitAttempted, false);
        Set(gNotificationVisible, false)

    hdr_Bg As rectangle:
        X: =0
        Y: =0
        Width: =App.Width
        Height: =gHeaderHeight
        Fill: =gColorPrimary
        BorderThickness: =0

    hdr_AppTitle As label:
        X: =16
        Y: =0
        Width: =280
        Height: =gHeaderHeight
        Text: ="VOR Requests"
        Color: =gColorWhite
        Font: =Font.OpenSansRegular
        Size: =20
        FontWeight: =FontWeight.Bold
        VerticalAlign: =VerticalAlign.Middle

    hdr_AvatarCircle As rectangle:
        X: =App.Width - 200
        Y: =16
        Width: =32
        Height: =32
        Fill: =gColorGold
        BorderThickness: =0
        RadiusTopLeft: =16
        RadiusTopRight: =16
        RadiusBottomLeft: =16
        RadiusBottomRight: =16

    hdr_AvatarInitial As label:
        X: =App.Width - 200
        Y: =16
        Width: =32
        Height: =32
        Text: =Upper(Left(User().FullName, 1))
        Color: =gColorWhite
        Font: =Font.OpenSansRegular
        Size: =14
        FontWeight: =FontWeight.Bold
        Align: =Align.Center
        VerticalAlign: =VerticalAlign.Middle

    hdr_UserName As label:
        X: =App.Width - 360
        Y: =0
        Width: =152
        Height: =gHeaderHeight
        Text: =User().FullName
        Color: =RGBA(220, 230, 245, 1)
        Font: =Font.OpenSansRegular
        Size: =13
        VerticalAlign: =VerticalAlign.Middle
        Align: =Align.Right

    nav_Bg As rectangle:
        X: =0
        Y: =gHeaderHeight
        Width: =gNavWidth
        Height: =App.Height - gHeaderHeight
        Fill: =gColorPrimaryDark
        BorderThickness: =0

    nav_NewActiveBar As rectangle:
        X: =0
        Y: =gHeaderHeight + 48
        Width: =4
        Height: =48
        Fill: =gColorGold

    nav_HomeBtn As button:
        X: =0
        Y: =gHeaderHeight
        Width: =gNavWidth
        Height: =48
        Text: ="  Home"
        Color: =RGBA(200, 215, 235, 1)
        Fill: =RGBA(255, 255, 255, 0)
        HoverFill: =RGBA(255, 255, 255, 0.1)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        Align: =Align.Left
        PaddingLeft: =20
        OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)

    nav_NewRequestBtn As button:
        X: =0
        Y: =gHeaderHeight + 48
        Width: =gNavWidth
        Height: =48
        Text: ="  New Request"
        Color: =gColorWhite
        Fill: =RGBA(255, 255, 255, 0.12)
        HoverFill: =RGBA(255, 255, 255, 0.18)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        FontWeight: =FontWeight.Semibold
        Align: =Align.Left
        PaddingLeft: =20
        OnSelect: =Navigate(NewRequestScreen, ScreenTransition.None)

    nav_MyQueueBtn As button:
        X: =0
        Y: =gHeaderHeight + 96
        Width: =gNavWidth
        Height: =48
        Text: ="  My Queue"
        Color: =RGBA(200, 215, 235, 1)
        Fill: =RGBA(255, 255, 255, 0)
        HoverFill: =RGBA(255, 255, 255, 0.1)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        Align: =Align.Left
        PaddingLeft: =20
        OnSelect: =Navigate(MyQueueScreen, ScreenTransition.Fade)

    nav_AllRequestsBtn As button:
        X: =0
        Y: =gHeaderHeight + 144
        Width: =gNavWidth
        Height: =48
        Text: ="  All Requests"
        Color: =RGBA(200, 215, 235, 1)
        Fill: =RGBA(255, 255, 255, 0)
        HoverFill: =RGBA(255, 255, 255, 0.1)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        Align: =Align.Left
        PaddingLeft: =20
        OnSelect: =Navigate(AllRequestsScreen, ScreenTransition.Fade)

    nav_ClosedBtn As button:
        X: =0
        Y: =gHeaderHeight + 192
        Width: =gNavWidth
        Height: =48
        Text: ="  Closed"
        Color: =RGBA(200, 215, 235, 1)
        Fill: =RGBA(255, 255, 255, 0)
        HoverFill: =RGBA(255, 255, 255, 0.1)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        Align: =Align.Left
        PaddingLeft: =20
        OnSelect: |-
            =Set(gClosedStatusFilter, true);
            Navigate(AllRequestsScreen, ScreenTransition.Fade)

    form_Breadcrumb As label:
        X: =gContentX + 32
        Y: =gContentY + 20
        Width: =500
        Height: =20
        Text: ="Home  >  New VOR Request"
        Color: =gColorTextMid
        Font: =Font.OpenSansRegular
        Size: =12

    form_PageTitle As label:
        X: =gContentX + 32
        Y: =gContentY + 44
        Width: =500
        Height: =32
        Text: ="New VOR Request"
        Color: =gColorTextDark
        Font: =Font.OpenSansRegular
        Size: =22
        FontWeight: =FontWeight.Bold

    form_CardBg As rectangle:
        X: =gContentX + 32
        Y: =gContentY + 88
        Width: =Min(App.Width - gContentX - 64, 720)
        Height: =720
        Fill: =gColorWhite
        RadiusTopLeft: =8
        RadiusTopRight: =8
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        BorderThickness: =1
        BorderColor: =gColorBorder

    f1_Lbl As label:
        X: =gContentX + 48
        Y: =gContentY + 108
        Width: =300
        Height: =18
        Text: ="Submitted on behalf of *"
        Color: =gColorTextDark
        Font: =Font.OpenSansRegular
        Size: =13
        FontWeight: =FontWeight.Semibold

    f1_Radio As radio:
        X: =gContentX + 48
        Y: =gContentY + 128
        Width: =320
        Height: =32
        Items: =["Workshop (self)", "Customer"]
        Default: ="Workshop (self)"
        Layout: =Layout.Horizontal
        Font: =Font.OpenSansRegular
        Size: =13
        Color: =gColorTextDark

    f2_Lbl As label:
        X: =gContentX + 48
        Y: =gContentY + 170
        Width: =300
        Height: =18
        Text: ="Customer name *"
        Color: =If(gSubmitAttempted && f1_Radio.Selected.Value = "Customer" && IsBlank(f2_TI.Text), gColorError, gColorTextDark)
        Font: =Font.OpenSansRegular
        Size: =13
        FontWeight: =FontWeight.Semibold
        Visible: =f1_Radio.Selected.Value = "Customer"

    f2_TI As textInput:
        X: =gContentX + 48
        Y: =gContentY + 190
        Width: =Min(App.Width - gContentX - 64, 720) - 32
        Height: =36
        HintText: ="Customer or company name"
        Font: =Font.OpenSansRegular
        Size: =14
        Color: =gColorTextDark
        BorderColor: =If(gSubmitAttempted && IsBlank(f2_TI.Text), gColorError, gColorBorder)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        Visible: =f1_Radio.Selected.Value = "Customer"

    f2_ErrLbl As label:
        X: =gContentX + 48
        Y: =gContentY + 228
        Width: =300
        Height: =16
        Text: ="Customer name is required"
        Color: =gColorError
        Font: =Font.OpenSansRegular
        Size: =11
        Visible: =gSubmitAttempted && f1_Radio.Selected.Value = "Customer" && IsBlank(f2_TI.Text)

    f3_Lbl As label:
        X: =gContentX + 48
        Y: =gContentY + 252
        Width: =300
        Height: =18
        Text: ="Vehicle identifier type *"
        Color: =gColorTextDark
        Font: =Font.OpenSansRegular
        Size: =13
        FontWeight: =FontWeight.Semibold

    f3_Radio As radio:
        X: =gContentX + 48
        Y: =gContentY + 272
        Width: =240
        Height: =32
        Items: =["VIN", "Stock#"]
        Default: ="VIN"
        Layout: =Layout.Horizontal
        Font: =Font.OpenSansRegular
        Size: =13
        Color: =gColorTextDark

    f4_Lbl As label:
        X: =gContentX + 48
        Y: =gContentY + 316
        Width: =300
        Height: =18
        Text: =If(f3_Radio.Selected.Value = "VIN", "VIN *", "Stock# *")
        Color: =If(gSubmitAttempted && IsBlank(f4_TI.Text), gColorError, gColorTextDark)
        Font: =Font.OpenSansRegular
        Size: =13
        FontWeight: =FontWeight.Semibold

    f4_TI As textInput:
        X: =gContentX + 48
        Y: =gContentY + 336
        Width: =Min(App.Width - gContentX - 64, 720) - 32
        Height: =36
        HintText: =If(f3_Radio.Selected.Value = "VIN", "Enter full VIN (17 characters)", "Enter Stock# (e.g. BCI-1234)")
        Font: =Font.OpenSansRegular
        Size: =14
        Color: =gColorTextDark
        BorderColor: =If(gSubmitAttempted && IsBlank(f4_TI.Text), gColorError, gColorBorder)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4

    f4_ErrLbl As label:
        X: =gContentX + 48
        Y: =gContentY + 374
        Width: =300
        Height: =16
        Text: =If(f3_Radio.Selected.Value = "VIN", "VIN is required", "Stock# is required")
        Color: =gColorError
        Font: =Font.OpenSansRegular
        Size: =11
        Visible: =gSubmitAttempted && IsBlank(f4_TI.Text)

    f5_Lbl As label:
        X: =gContentX + 48
        Y: =gContentY + 398
        Width: =300
        Height: =18
        Text: ="Fault description *"
        Color: =If(gSubmitAttempted && IsBlank(f5_TI.Text), gColorError, gColorTextDark)
        Font: =Font.OpenSansRegular
        Size: =13
        FontWeight: =FontWeight.Semibold

    f5_TI As textInput:
        X: =gContentX + 48
        Y: =gContentY + 418
        Width: =Min(App.Width - gContentX - 64, 720) - 32
        Height: =72
        HintText: ="Describe the fault or reason the vehicle is off road..."
        Mode: =TextMode.MultiLine
        Font: =Font.OpenSansRegular
        Size: =14
        Color: =gColorTextDark
        BorderColor: =If(gSubmitAttempted && IsBlank(f5_TI.Text), gColorError, gColorBorder)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4

    f5_ErrLbl As label:
        X: =gContentX + 48
        Y: =gContentY + 492
        Width: =300
        Height: =16
        Text: ="Fault description is required"
        Color: =gColorError
        Font: =Font.OpenSansRegular
        Size: =11
        Visible: =gSubmitAttempted && IsBlank(f5_TI.Text)

    f6_Lbl As label:
        X: =gContentX + 48
        Y: =gContentY + 516
        Width: =220
        Height: =18
        Text: ="Part name *"
        Color: =If(gSubmitAttempted && IsBlank(f6_TI.Text), gColorError, gColorTextDark)
        Font: =Font.OpenSansRegular
        Size: =13
        FontWeight: =FontWeight.Semibold

    f7_Lbl As label:
        X: =gContentX + 48 + 240
        Y: =gContentY + 516
        Width: =220
        Height: =18
        Text: ="Part number (optional)"
        Color: =gColorTextDark
        Font: =Font.OpenSansRegular
        Size: =13
        FontWeight: =FontWeight.Semibold

    f6_TI As textInput:
        X: =gContentX + 48
        Y: =gContentY + 536
        Width: =228
        Height: =36
        HintText: ="e.g. Air filter, clutch plate"
        Font: =Font.OpenSansRegular
        Size: =14
        Color: =gColorTextDark
        BorderColor: =If(gSubmitAttempted && IsBlank(f6_TI.Text), gColorError, gColorBorder)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4

    f7_TI As textInput:
        X: =gContentX + 48 + 240
        Y: =gContentY + 536
        Width: =Min(App.Width - gContentX - 64, 720) - 32 - 240
        Height: =36
        HintText: ="e.g. SITRAK-AF-1042 (if known)"
        Font: =Font.OpenSansRegular
        Size: =14
        Color: =gColorTextDark
        BorderColor: =gColorBorder
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4

    f6_ErrLbl As label:
        X: =gContentX + 48
        Y: =gContentY + 574
        Width: =228
        Height: =16
        Text: ="Part name is required"
        Color: =gColorError
        Font: =Font.OpenSansRegular
        Size: =11
        Visible: =gSubmitAttempted && IsBlank(f6_TI.Text)

    f8_Lbl As label:
        X: =gContentX + 48
        Y: =gContentY + 598
        Width: =120
        Height: =18
        Text: ="Quantity *"
        Color: =If(gSubmitAttempted && (IsBlank(f8_TI.Text) || Not(IsNumeric(f8_TI.Text)) || Value(f8_TI.Text) < 1), gColorError, gColorTextDark)
        Font: =Font.OpenSansRegular
        Size: =13
        FontWeight: =FontWeight.Semibold

    f9_Lbl As label:
        X: =gContentX + 48 + 152
        Y: =gContentY + 598
        Width: =300
        Height: =18
        Text: ="Urgency *"
        Color: =gColorTextDark
        Font: =Font.OpenSansRegular
        Size: =13
        FontWeight: =FontWeight.Semibold

    f8_TI As textInput:
        X: =gContentX + 48
        Y: =gContentY + 618
        Width: =140
        Height: =36
        Default: ="1"
        HintText: ="1"
        Font: =Font.OpenSansRegular
        Size: =14
        Color: =gColorTextDark
        BorderColor: =If(gSubmitAttempted && (IsBlank(f8_TI.Text) || Not(IsNumeric(f8_TI.Text)) || Value(f8_TI.Text) < 1), gColorError, gColorBorder)
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4

    f8_ErrLbl As label:
        X: =gContentX + 48
        Y: =gContentY + 656
        Width: =140
        Height: =16
        Text: ="Must be >= 1"
        Color: =gColorError
        Font: =Font.OpenSansRegular
        Size: =11
        Visible: =gSubmitAttempted && (IsBlank(f8_TI.Text) || Not(IsNumeric(f8_TI.Text)) || Value(f8_TI.Text) < 1)

    f9_Radio As radio:
        X: =gContentX + 48 + 152
        Y: =gContentY + 614
        Width: =360
        Height: =40
        Items: =["Safety critical", "Operational", "Scheduled"]
        Default: ="Operational"
        Layout: =Layout.Horizontal
        Font: =Font.OpenSansRegular
        Size: =13
        Color: =gColorTextDark

    f10_Lbl As label:
        X: =gContentX + 48
        Y: =gContentY + 680
        Width: =220
        Height: =18
        Text: ="Requestor name *"
        Color: =gColorTextDark
        Font: =Font.OpenSansRegular
        Size: =13
        FontWeight: =FontWeight.Semibold

    f11_Lbl As label:
        X: =gContentX + 48 + 240
        Y: =gContentY + 680
        Width: =200
        Height: =18
        Text: ="Date submitted"
        Color: =gColorTextDark
        Font: =Font.OpenSansRegular
        Size: =13
        FontWeight: =FontWeight.Semibold

    f10_TI As textInput:
        X: =gContentX + 48
        Y: =gContentY + 700
        Width: =228
        Height: =36
        Default: =User().FullName
        HintText: ="Your full name"
        Font: =Font.OpenSansRegular
        Size: =14
        Color: =gColorTextDark
        BorderColor: =gColorBorder
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4

    f11_DateLbl As label:
        X: =gContentX + 48 + 240
        Y: =gContentY + 700
        Width: =228
        Height: =36
        Text: =Text(Now(), "[$-en-AU]d mmm yyyy h:mm AM/PM")
        Color: =gColorTextMid
        Font: =Font.OpenSansRegular
        Size: =13
        VerticalAlign: =VerticalAlign.Middle
        PaddingLeft: =4

    footer_Bg As rectangle:
        X: =gContentX
        Y: =App.Height - 64
        Width: =App.Width - gContentX
        Height: =64
        Fill: =gColorWhite
        BorderThickness: =0

    footer_TopLine As rectangle:
        X: =gContentX
        Y: =App.Height - 64
        Width: =App.Width - gContentX
        Height: =1
        Fill: =gColorBorder
        BorderThickness: =0

    footer_DraftBtn As button:
        X: =gContentX + 32
        Y: =App.Height - 52
        Width: =160
        Height: =40
        Text: ="Save as Draft"
        Color: =gColorPrimary
        Fill: =gColorWhite
        HoverFill: =RGBA(215, 187, 132, 0.2)
        PressedFill: =RGBA(215, 187, 132, 0.4)
        BorderThickness: =1
        BorderColor: =gColorPrimary
        Font: =Font.OpenSansRegular
        Size: =14
        FontWeight: =FontWeight.Semibold
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        OnSelect: |-
            =Patch(
              VORRequests,
              Defaults(VORRequests),
              {
                Title: "VOR-" & Text(Max(VORRequests, Value(Mid(Title, 5, 4))) + 1, "0000"),
                SubmittedOnBehalfOf: {Value: f1_Radio.Selected.Value},
                CustomerName: If(f1_Radio.Selected.Value = "Customer", f2_TI.Text, ""),
                IdentifierType: {Value: f3_Radio.Selected.Value},
                VehicleIdentifier: f4_TI.Text,
                FaultDescription: f5_TI.Text,
                PartName: f6_TI.Text,
                PartNumber: f7_TI.Text,
                Quantity: If(IsNumeric(f8_TI.Text), Value(f8_TI.Text), 1),
                Urgency: {Value: f9_Radio.Selected.Value},
                RequestorName: f10_TI.Text,
                DateSubmitted: Now(),
                CurrentStatus: {Value: "Draft"},
                StageNotes: "[" & Text(Today(), "yyyy-mm-dd") & " " & Text(Hour(Now()), "00") & ":" & Text(Minute(Now()), "00") & "] " & User().FullName & ": Saved as draft"
              }
            );
            Set(gNotificationMessage, "Draft saved.");
            Set(gNotificationVisible, true);
            Navigate(HomeScreen, ScreenTransition.Fade)

    footer_SubmitBtn As button:
        X: =gContentX + 208
        Y: =App.Height - 52
        Width: =160
        Height: =40
        Text: ="Submit"
        Color: =gColorWhite
        Fill: =gColorPrimary
        HoverFill: =RGBA(36, 73, 130, 0.85)
        PressedFill: =RGBA(26, 52, 94, 1)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        FontWeight: =FontWeight.Semibold
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        OnSelect: |-
            =If(
              IsBlank(f4_TI.Text) ||
              IsBlank(f5_TI.Text) ||
              IsBlank(f6_TI.Text) ||
              Not(IsNumeric(f8_TI.Text)) ||
              Value(f8_TI.Text) < 1 ||
              (f1_Radio.Selected.Value = "Customer" && IsBlank(f2_TI.Text)),
              Set(gSubmitAttempted, true),
              With(
                {
                  newVORNum: "VOR-" & Text(Max(VORRequests, Value(Mid(Title, 5, 4))) + 1, "0000"),
                  stageEntry: "[" & Text(Today(), "yyyy-mm-dd") & " " & Text(Hour(Now()), "00") & ":" & Text(Minute(Now()), "00") & "] " & User().FullName & ": Submitted"
                },
                Patch(
                  VORRequests,
                  Defaults(VORRequests),
                  {
                    Title: newVORNum,
                    SubmittedOnBehalfOf: {Value: f1_Radio.Selected.Value},
                    CustomerName: If(f1_Radio.Selected.Value = "Customer", f2_TI.Text, ""),
                    IdentifierType: {Value: f3_Radio.Selected.Value},
                    VehicleIdentifier: f4_TI.Text,
                    FaultDescription: f5_TI.Text,
                    PartName: f6_TI.Text,
                    PartNumber: f7_TI.Text,
                    Quantity: Value(f8_TI.Text),
                    Urgency: {Value: f9_Radio.Selected.Value},
                    RequestorName: f10_TI.Text,
                    DateSubmitted: Now(),
                    CurrentStatus: {Value: "Submitted"},
                    StageNotes: stageEntry
                  }
                )
              );
              Set(gNotificationMessage, "VOR request submitted successfully.");
              Set(gNotificationVisible, true);
              Set(gSubmitAttempted, false);
              Navigate(HomeScreen, ScreenTransition.Fade)
            )

    footer_CancelBtn As button:
        X: =gContentX + 384
        Y: =App.Height - 52
        Width: =80
        Height: =40
        Text: ="Cancel"
        Color: =gColorTextMid
        Fill: =RGBA(255, 255, 255, 0)
        HoverFill: =RGBA(200, 200, 200, 0.2)
        BorderThickness: =0
        Font: =Font.OpenSansRegular
        Size: =14
        OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)
